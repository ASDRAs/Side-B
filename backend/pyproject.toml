[project]
name = "side-b"
version = "0.1.0"
description = ""
authors = [
    {name = "TaeYun",email = "48724872+KimTaeYun02@users.noreply.github.com"}
]
requires-python = ">=3.12"
dependencies = [
    "google-genai (==1.45.0)",
    "fastapi (==0.115.0)",
    "uvicorn[standard] (>=0.47.0,<0.48.0)",
    "pylast (==5.3.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "async-lru (>=2.3.0,<3.0.0)",
    "pykakasi (>=2.3.0,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "transformers (>=5.16.1,<6.0.0)",
    "librosa (>=1.0.0,<2.0.0)",
    "soundfile (>=0.14.0,<0.15.0)",
    "torch (>=2.13.0,<3.0.0)",
    "numpy (<2.3)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
[dependency-groups]
dev = [
    "ruff (>=0.15.14,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]

[tool.ruff]
# 최대 줄 길이 설정 (기본값은 88, 보통 88이나 119를 많이 씁니다)
line-length = 88

# 파이썬 타겟 버전 설정
target-version = "py310" 

[tool.ruff.lint]
# 적용할 린터 규칙 선택 (E: pycodestyle, F: Pyflakes, I: isort)
select = ["E", "F", "I"]
# 무시할 규칙
ignore = ["E501"]

[tool.ruff.format]
# 포매팅할 때 따옴표 스타일 (기본값 "double")
quote-style = "double"