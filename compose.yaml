name: side-b

services:
  backend:
    image: side-b-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./.env
    ports:
      - name: http
        target: 8080
        published: "${BACKEND_PORT:-8000}"
        protocol: tcp
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
