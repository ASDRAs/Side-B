<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Side-B</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">MUSIC DISCOVERY</p>
          <h1>Side-B</h1>
        </div>

        <span id="connectionBadge" class="badge badge-idle">
          대기
        </span>
      </header>

      <!-- 현재 재생 중인 곡 -->
      <section class="current-track">
        <button id="currentTrackButton" type="button">
          현재 곡 가져오기
        </button>

        <div id="currentTrackResult" hidden>
          <p class="section-label">현재 재생 중</p>

          <div class="seed-line">
            <strong id="currentTrackTitle"></strong>
            <span id="currentTrackArtist"></span>
          </div>
        </div>
      </section>

      <!-- EQ 설정-->
      <section class="eq-test-section">
        <p class="section-label">EQ 테스트</p>

        <div class="eq-test-buttons">
          <button id="eqTestButton" type="button">
            EQ 테스트 적용
          </button>

          <button id="eqStopButton" type="button">
            EQ 해제
          </button>
        </div>

        <p id="eqTestStatus" class="status">
          EQ가 적용되지 않았습니다.
        </p>
      </section>
      <!-- 추천 요청 -->
      <form id="recommendForm" class="request-form">
        <label for="apiBaseUrl">
          백엔드 주소
        </label>

        <input
          id="apiBaseUrl"
          name="apiBaseUrl"
          type="url"
          value="https://side-b-backend-7hmhv6htsa-du.a.run.app"
          autocomplete="url"
          required
        />

        <label for="youtubeExportToken">
          YouTube 내보내기 토큰
        </label>

        <input
          id="youtubeExportToken"
          name="youtubeExportToken"
          type="password"
          autocomplete="off"
          placeholder="YOUTUBE_EXPORT_TOKEN"
        />

        <label for="query">
          검색어
        </label>

        <div class="query-row">
          <input
            id="query"
            name="query"
            type="search"
            maxlength="200"
            placeholder="윤하 - 혜성"
            autocomplete="off"
            required
          />

          <button id="submitButton" type="submit">
            추천 요청
          </button>
        </div>
      </form>

      <!-- 상태 메시지 -->
      <p
        id="statusMessage"
        class="status"
        role="status"
        aria-live="polite"
      >
        검색어를 입력하세요.
      </p>

      <!-- 추천 기준 음악 -->
      <section id="seedSection" class="seed-section" hidden>
        <p class="section-label">
          기준 음악
        </p>

        <div class="seed-line">
          <strong id="seedTitle"></strong>
          <span id="seedArtist"></span>
        </div>
      </section>

      <!-- 추천 결과 -->
      <section
        id="results"
        class="results"
        aria-label="추천 결과"
      ></section>

      <section id="youtubeExportPanel" class="export-panel" hidden>
        <div class="export-panel-heading">
          <p class="section-label">YouTube Music 내보내기</p>
          <strong id="youtubeExportStatus"></strong>
        </div>
        <p id="youtubeExportTitle" class="export-title"></p>
        <p id="youtubeExportDetail" class="export-detail"></p>
        <ul id="youtubeExportFailures" class="export-failures" hidden></ul>
        <div id="youtubeMatchReview" class="match-review" hidden>
          <ol id="youtubeMatchList" class="match-list"></ol>
          <div class="match-review-actions">
            <button id="youtubeMatchCancel" class="secondary-button" type="button">
              취소
            </button>
            <button id="youtubeMatchConfirm" type="button">
              플레이리스트 생성
            </button>
          </div>
        </div>
        <div id="youtubeExportLinks" class="export-links" hidden>
          <a id="youtubeLink" target="_blank" rel="noreferrer">YouTube</a>
          <a id="youtubeMusicLink" target="_blank" rel="noreferrer">
            YouTube Music
          </a>
        </div>
      </section>

      <!-- 원본 JSON -->
      <details id="rawPanel" class="raw-panel" hidden>
        <summary>
          원본 JSON
        </summary>

        <pre id="rawResponse"></pre>
      </details>
    </main>

    <!-- 추천 bucket template -->
    <template id="bucketTemplate">
      <section class="bucket">
        <div class="bucket-heading">
          <h2></h2>
          <div class="bucket-actions">
            <span class="count"></span>
            <button class="export-button" type="button">
              YouTube Music
            </button>
          </div>
        </div>

        <ol class="track-list"></ol>
      </section>
    </template>

    <!-- 개별 track template -->
    <template id="trackTemplate">
      <li class="track-item">
        <span class="rank"></span>

        <div class="track-copy">
          <strong class="track-title"></strong>
          <span class="track-artist"></span>
          <span class="track-label"></span>
        </div>
      </li>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
